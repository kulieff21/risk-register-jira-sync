[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risk-register-jira-sync"
version = "0.1.0"
description = "Keep an ISO 27001 risk register in Excel and its treatment work in Jira consistent, with an audit trail."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elmar Guliyev" }]
dependencies = ["openpyxl>=3.1"]

[project.scripts]
rrsync = "rrsync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/rrsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
